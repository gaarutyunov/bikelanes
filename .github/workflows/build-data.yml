name: Build data

# Builds the real Málaga artifacts from the municipal portal + OSM (Overpass)
# on GitHub's runners, which (unlike a maintainer's sandbox) have the required
# outbound network access. Runs on demand and on a weekly schedule, commits the
# refreshed /data back to the repo, then builds and deploys the site in the same
# job (a GITHUB_TOKEN push does not itself trigger deploy.yml).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Optional: install tippecanoe for the bikelanes PMTiles layer. Without it
      # the pipeline falls back to the committed GeoJSON display layer.
      # - run: sudo apt-get update && sudo apt-get install -y tippecanoe

      - name: Fetch sources (municipal + OSM/Overpass)
        run: npm run fetch:data

      - name: Build prebuilt artifacts
        run: npm run build:data

      - name: Commit refreshed /data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh prebuilt /data artifacts"
            git push
          fi

      - name: Build app
        run: npm run build:app

      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true # preserve pr-preview/ subdirectories
