name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: pages-production
  cancel-in-progress: false
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Build the real Málaga artifacts on CI (it has the network access the
      # municipal portal + Overpass need). Raw sources are cached weekly so most
      # runs skip the downloads. (SPEC §17.2)
      - id: stamp
        run: echo "week=$(date +%Y-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: pipeline/raw
          key: malaga-raw-${{ steps.stamp.outputs.week }}
      - run: npm run fetch:data
      - run: npm run build:data

      # Route-gate: never publish a build whose routes ignore the lane network.
      - run: npm run check:routing

      - run: npm run build:app

      # Smoke-gate: never publish a build whose map fails to render.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ''
      - run: npm run smoke

      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true # preserve pr-preview/ subdirectories
