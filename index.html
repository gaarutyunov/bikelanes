<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>BikeNav Málaga — bike-lane navigation for Málaga</title>
    <meta
      name="description"
      content="Browser-only, client-side bike-lane navigation for Málaga: routes that prefer bike lanes, live turn-by-turn, and journey history — all in your browser, no server."
    />

    <!-- Open Graph / link-preview metadata. Consumed by garutyunov.com's Pet
         Projects section, which crawls this page at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bikelanes.garutyunov.com/" />
    <meta property="og:title" content="BikeNav Málaga" />
    <meta
      property="og:description"
      content="Browser-only bike-lane navigation for Málaga — routes that prefer bike lanes, live turn-by-turn, all in your browser."
    />
    <meta property="og:image" content="https://bikelanes.garutyunov.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="article:published_time" content="2025-06-15" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BikeNav Málaga" />
    <meta
      name="twitter:description"
      content="Browser-only bike-lane navigation for Málaga — routes that prefer bike lanes, live turn-by-turn, all in your browser."
    />
    <meta name="twitter:image" content="https://bikelanes.garutyunov.com/og-image.png" />

    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Fonts: same families as garutyunov.com / stereoscope (Geist / Geist Mono
         / Fira Mono) — the GA ui-kit house typography. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Fira+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/app/styles.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel" class="panel">
      <header class="panel-head">
        <h1>BikeNav <span>Málaga</span></h1>
        <button id="toggle-history" class="ghost" title="Journey history">History</button>
      </header>

      <div id="status" class="status" role="status"></div>

      <!-- Search -->
      <section class="block">
        <div class="search-wrap">
          <input id="search" type="text" placeholder="Search address or place…" autocomplete="off" />
          <ul id="search-results" class="results" hidden></ul>
        </div>
      </section>

      <!-- Start / end -->
      <section class="block endpoints">
        <div class="endpoint">
          <span class="dot start"></span>
          <input id="start-label" type="text" placeholder="Start — search, click map, or use location" readonly />
          <button id="start-loc" class="ghost" title="Use my location">◎</button>
        </div>
        <div class="endpoint">
          <span class="dot end"></span>
          <input id="end-label" type="text" placeholder="Destination" readonly />
          <button id="swap" class="ghost" title="Swap">⇅</button>
        </div>
      </section>

      <!-- Preference slider -->
      <section class="block">
        <label class="slider-label">
          <span>Prefer bike lanes</span><span>Fastest</span>
        </label>
        <input id="pref" type="range" min="0" max="1" step="0.05" value="0.35" />
      </section>

      <!-- Import -->
      <section class="block import-row">
        <label class="filebtn">
          Import GeoJSON
          <input id="import-file" type="file" accept=".geojson,.json,application/geo+json" hidden />
        </label>
        <label class="merge-toggle"><input id="import-merge" type="checkbox" checked /> merge w/ Málaga</label>
        <button id="import-clear" class="ghost" hidden>Clear</button>
      </section>

      <!-- Route panel -->
      <section id="route-panel" class="block route-panel" hidden>
        <div class="route-stats">
          <div><strong id="r-distance">–</strong><small>distance</small></div>
          <div><strong id="r-eta">–</strong><small id="r-eta-src">ETA</small></div>
          <div><strong id="r-road">–</strong><small>on roads</small></div>
        </div>
        <ol id="r-steps" class="steps"></ol>
        <button id="start-ride" class="primary">Start ride</button>
      </section>

      <button id="free-ride" class="ghost wide">Free-track a ride (no route)</button>

      <!-- Cross-site links — matches the garutyunov.com / stereoscope house nav. -->
      <footer class="site-links">
        <a href="https://garutyunov.com">← garutyunov.com</a>
        <a
          href="https://github.com/gaarutyunov/bikelanes"
          target="_blank"
          rel="noreferrer noopener"
          aria-label="Source on GitHub"
          title="Source on GitHub"
        >Source</a>
      </footer>
    </aside>

    <!-- Navigation HUD -->
    <section id="hud" class="hud" hidden>
      <div id="hud-offroute" class="offroute" hidden>
        Off route — <button id="reroute" class="link">reroute?</button>
      </div>
      <div class="hud-grid">
        <div class="hud-main"><strong id="h-speed">0.0</strong><small>km/h now</small></div>
        <div><strong id="h-avg">0.0</strong><small>avg km/h</small></div>
        <div><strong id="h-eta">–</strong><small>ETA</small></div>
        <div><strong id="h-remain">–</strong><small>remaining</small></div>
        <div><strong id="h-covered">–</strong><small>covered</small></div>
        <div><strong id="h-elapsed">0:00</strong><small>elapsed</small></div>
      </div>
      <div class="hud-actions">
        <button id="h-recenter" class="ghost">Recenter</button>
        <span id="h-wake" class="wake" title="Screen wake lock">●</span>
        <button id="h-pause" class="ghost">Pause</button>
        <button id="h-stop" class="primary">Stop</button>
        <button id="h-cancel" class="ghost">Cancel</button>
      </div>
    </section>

    <!-- History panel -->
    <section id="history" class="history" hidden>
      <header class="history-head">
        <h2>Journey history</h2>
        <button id="history-close" class="ghost">✕</button>
      </header>
      <div class="history-tools">
        <span id="history-usage" class="usage"></span>
        <button id="history-export" class="ghost">Export</button>
        <label class="filebtn small">Import<input id="history-import" type="file" accept=".json" hidden /></label>
        <button id="history-clear" class="ghost danger">Clear all</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>

    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
